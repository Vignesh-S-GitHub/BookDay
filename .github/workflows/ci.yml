name: BookDay quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --group data
      - run: npm ci
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv check
      - run: uv run pytest
      - run: npm test
      - run: uv run --group data -m scripts.holiday_pipeline validate
      - run: uv audit
      - run: npm audit
      - run: uv run scripts/check_assets.py
