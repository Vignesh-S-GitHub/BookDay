<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>BookDay · Know When to Book.</title>
    <meta
      name="description"
      content="Find booking opening dates, plan around verified Indian holidays and save reminders to your calendar."
    />
    <meta name="theme-color" content="#0B5FFF" />
    <meta
      name="htmx-config"
      content='{"includeIndicatorStyles":false,"allowEval":false}'
    />
    <link rel="icon" href="/art/app-icon.svg" />
    <link rel="apple-touch-icon" href="/art/app_icon_192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/vendor/htmx.min.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <a
          class="planner-back icon-button"
          href="#/explore"
          aria-label="Back to Explore"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#back"></use></svg
        ></a>
        <a href="#/home" aria-label="BookDay Home"
          ><img class="logo" src="/art/logo.webp" alt="BookDay" /></a
        ><label class="state-pill"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#location"></use></svg
          ><select
            id="home-state"
            aria-label="Home state or Union Territory"
          ></select></label
        ><a
          class="icon-button"
          href="#/reminders"
          aria-label="Calendar reminders help"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#bell"></use></svg
        ></a>
      </header>
      <main id="main" tabindex="-1">
        <p class="loading">Loading your planner…</p>
      </main>
      <nav class="bd-bottomnav" aria-label="Primary navigation">
        <a class="bd-navitem" href="#/home"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#home"></use></svg
          >Home</a
        ><a class="bd-navitem" href="#/explore"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#explore"></use></svg
          >Explore</a
        ><a class="bd-navitem" href="#/calendar"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#calendar"></use></svg
          >Calendar</a
        ><a class="bd-navitem" href="#/saved"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#saved"></use></svg
          >Saved</a
        ><a class="bd-navitem" href="#/more"
          ><svg class="icon" aria-hidden="true">
            <use href="/art/icons.svg#more"></use></svg
          >More</a
        >
      </nav>
    </div>
    <dialog id="calendar-dialog" aria-labelledby="calendar-title">
      <div class="sheet-heading">
        <h2 id="calendar-title">Add to Calendar</h2>
        <button
          class="icon-button"
          id="close-dialog"
          aria-label="Close calendar options"
        >
          ×
        </button>
      </div>
      <div id="calendar-options"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="bd-page">
        BookDay needs JavaScript for its calendar, device storage and exports.
        Enable JavaScript to use the planner.
      </p></noscript
    >
  </body>
</html>
