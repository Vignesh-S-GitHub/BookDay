<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>BookDay · Know When to Book.</title>
    <meta
      name="description"
      content="Find booking opening dates, plan around verified Indian holidays and save reminders to your calendar."
    />
    <meta name="theme-color" content="#0B5FFF" />
    <meta
      name="htmx-config"
      content='{"includeIndicatorStyles":false,"allowEval":false}'
    />
    <link rel="icon" href="/assets/brand/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="/assets/brand/apple_touch_icon_180.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/vendor/htmx.min.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <a href="#/home" aria-label="BookDay Home"
          ><img
            class="logo"
            src="/assets/brand/bookday_logo_horizontal.png"
            alt="BookDay" /></a
        ><label class="state-pill"
          ><img src="/assets/icons/location.svg" alt="" /><select
            id="home-state"
            aria-label="Home state or Union Territory"
          ></select></label
        ><a
          class="icon-button"
          href="#/reminders"
          aria-label="Calendar reminders help"
          ><img src="/assets/icons/bell.svg" alt=""
        /></a>
      </header>
      <main id="main" tabindex="-1">
        <p class="loading">Loading your planner…</p>
      </main>
      <nav class="bd-bottomnav" aria-label="Primary navigation">
        <a class="bd-navitem" href="#/home"
          ><img src="/assets/icons/home.svg" alt="" />Home</a
        ><a class="bd-navitem" href="#/explore"
          ><img src="/assets/icons/explore.svg" alt="" />Explore</a
        ><a class="bd-navitem" href="#/calendar"
          ><img src="/assets/icons/calendar.svg" alt="" />Calendar</a
        ><a class="bd-navitem" href="#/saved"
          ><img src="/assets/icons/saved.svg" alt="" />Saved</a
        ><a class="bd-navitem" href="#/more"
          ><img src="/assets/icons/more.svg" alt="" />More</a
        >
      </nav>
    </div>
    <dialog id="calendar-dialog" aria-labelledby="calendar-title">
      <div class="sheet-heading">
        <h2 id="calendar-title">Add to Calendar</h2>
        <button
          class="icon-button"
          id="close-dialog"
          aria-label="Close calendar options"
        >
          ×
        </button>
      </div>
      <div id="calendar-options"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="bd-page">
        BookDay needs JavaScript for its calendar, device storage and exports.
        Enable JavaScript to use the planner.
      </p></noscript
    >
  </body>
</html>
