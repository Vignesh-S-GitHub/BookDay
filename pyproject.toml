[project]
name = "bookday"
version = "0.1.0"
description = "BookDay booking date planner, FastAPI and HTMX PWA"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "icalendar>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "uvicorn>=0.54.0",
    "workers-py>=1.17.7",
    "workers-runtime-sdk>=1.9.3",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include = ["src/bookday", "tests"]
